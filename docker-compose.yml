version: '3.8'

services:
  backend:
    build: ./backend
    env_file: ./backend/.env
    restart: always

  frontend:
    build: ./frontend
    restart: always

  proxy:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    depends_on:
      - backend
      - frontend
    restart: always